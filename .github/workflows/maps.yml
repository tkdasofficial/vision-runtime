name: maps
# Generated by scripts/gen_workflows.py — routes to workers/maps/index.py.
# Started only by the VISION backend (workflow_dispatch); no push or schedule triggers.
# Inputs carry no secrets or file data; the runner authenticates to the relay with GitHub OIDC.
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "VISION job id (UUID)", required: true, type: string }
      operation: { description: "Registered operation", required: true, type: choice, options: [data_convert, checksum] }

permissions:
  contents: read
  id-token: write

concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Install worker dependencies
        if: inputs.operation != 'checksum'
        run: python3 -m pip install --quiet --break-system-packages pyarrow==21.0.0 fastavro==1.12.0 pyshp==2.3.1
      - name: Run worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          OPERATION: ${{ inputs.operation }}
          WORKFLOW: maps
          WORKER: maps
        run: python3 runtime/runner.py
