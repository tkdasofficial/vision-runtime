name: diagrams
# Generated by scripts/gen_workflows.py — routes to workers/diagrams/index.py.
# Started only by the VISION backend (workflow_dispatch); no push or schedule triggers.
# Inputs carry no secrets or file data; the runner authenticates to the relay with GitHub OIDC.
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "VISION job id (UUID)", required: true, type: string }
      operation: { description: "Registered operation", required: true, type: choice, options: [render, checksum] }

permissions:
  contents: read
  id-token: write

concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Install worker dependencies
        if: inputs.operation != 'checksum'
        run: python3 -m pip install --quiet --break-system-packages cairosvg==2.8.2 ezdxf==1.4.2 matplotlib==3.10.5 pypdf==5.9.0
      - name: Install native tools (render)
        if: inputs.operation == 'render'
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends graphviz plantuml libcairo2 >/dev/null
      - if: inputs.operation == 'render'
        run: npm install -g --silent @mermaid-js/mermaid-cli@11.4.2 >/dev/null
      - name: Run worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          OPERATION: ${{ inputs.operation }}
          WORKFLOW: diagrams
          WORKER: diagrams
        run: python3 runtime/runner.py
