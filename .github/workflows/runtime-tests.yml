name: runtime-tests
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress 7zip calibre graphviz plantuml texlive-latex-base texlive-latex-recommended texlive-fonts-recommended libcairo2 >/dev/null && (command -v 7z || sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z)
      - run: npm install -g --silent @mermaid-js/mermaid-cli@11.4.2
      - run: python3 -m pip install --quiet --break-system-packages -r requirements.txt pytest==8.3.5
      - run: python3 -m pytest -q tests
