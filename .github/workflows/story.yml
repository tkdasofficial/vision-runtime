name: story
# Story tasks: runs workers/story/index.py through the runner. Dispatched only by the VISION backend.
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "VISION job id (UUID)", required: true, type: string }

permissions:
  contents: read
  id-token: write   # only to mint the OIDC token the relay verifies

concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Install pinned dependencies
        run: python3 -m pip install --quiet --break-system-packages -r requirements.txt
      - name: Run story
        env:
          JOB_ID: ${{ inputs.job_id }}
          OPERATION: story_generate
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python3 runtime/runner.py
