name: run-job
# Runs exactly one registered VISION operation. Dispatched only by the VISION backend.
# Inputs carry no secrets and no file data: the runner proves its identity to the relay
# with GitHub OIDC and pulls its (integrity-checked) input from there.
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "VISION job id (UUID)", required: true, type: string }
      operation: { description: "Registered operation", required: true, type: choice, options: [checksum, image_convert, video_convert, audio_convert, office_convert, data_convert, archive_convert, ebook_convert, font_convert, render, story_generate] }

permissions:
  contents: read
  id-token: write   # only to mint the OIDC token the relay verifies

concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Install pinned dependencies
        run: python3 -m pip install --quiet --break-system-packages -r requirements.txt
      - name: Install native tools for this operation only
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          pkgs=""
          case "$OPERATION" in
            video_convert|audio_convert) pkgs="ffmpeg" ;;
            image_convert) pkgs="libcairo2" ;;
            office_convert) pkgs="libreoffice-writer libreoffice-calc libreoffice-impress" ;;
            archive_convert) pkgs="7zip" ;;
            ebook_convert) pkgs="calibre 7zip" ;;
            render) pkgs="graphviz plantuml texlive-latex-base texlive-latex-recommended texlive-fonts-recommended libcairo2" ;;
          esac
          if [ -n "$pkgs" ]; then sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $pkgs >/dev/null; fi
          if [ "$OPERATION" = "archive_convert" ] || [ "$OPERATION" = "ebook_convert" ]; then command -v 7z >/dev/null || sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z; fi
          if [ "$OPERATION" = "render" ]; then npm install -g --silent @mermaid-js/mermaid-cli@11.4.2 >/dev/null; fi
      - name: Run job
        env:
          JOB_ID: ${{ inputs.job_id }}
          OPERATION: ${{ inputs.operation }}
          NVIDIA_API_KEY: ${{ inputs.operation == 'story_generate' && secrets.NVIDIA_API_KEY || '' }}
          GROQ_API_KEY: ${{ inputs.operation == 'story_generate' && secrets.GROQ_API_KEY || '' }}
        run: python3 runtime/runner.py
