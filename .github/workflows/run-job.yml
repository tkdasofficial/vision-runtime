name: run-job
# Runs exactly one registered VISION operation. Dispatched only by the VISION backend.
# Inputs carry no secrets and no file data: the runner proves its identity to the relay
# with GitHub OIDC and pulls its (integrity-checked) input from there.
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "VISION job id (UUID)", required: true, type: string }
      operation: { description: "Registered operation", required: true, type: choice, options: [checksum, image_convert, video_convert] }

permissions:
  contents: read
  id-token: write   # only to mint the OIDC token the relay verifies

concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Install pinned dependencies
        run: python3 -m pip install --quiet --break-system-packages -r requirements.txt
      - name: Install ffmpeg
        if: inputs.operation == 'video_convert'
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null)
      - name: Run job
        env:
          JOB_ID: ${{ inputs.job_id }}
          OPERATION: ${{ inputs.operation }}
        run: python3 runtime/runner.py
