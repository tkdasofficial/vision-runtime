name: images
# Generated by scripts/gen_workflows.py — routes to workers/images/index.py.
# Started only by the VISION backend (workflow_dispatch); no push or schedule triggers.
# Inputs carry no secrets or file data; the runner authenticates to the relay with GitHub OIDC.
on:
  workflow_dispatch:
    inputs:
      job_id: { description: "VISION job id (UUID)", required: true, type: string }
      operation: { description: "Registered operation", required: true, type: choice, options: [image_convert, checksum] }

permissions:
  contents: read
  id-token: write

concurrency:
  group: job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - name: Install worker dependencies
        run: python3 -m pip install --quiet --break-system-packages Pillow==11.3.0 pillow-heif==1.1.0 cairosvg==2.8.2 pypdf==5.9.0
      - name: Install native tools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libcairo2 >/dev/null
      - name: Run worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          OPERATION: ${{ inputs.operation }}
          WORKFLOW: images
          WORKER: images
        run: python3 runtime/runner.py
